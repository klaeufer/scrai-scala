# Copy to ~/.config/scrai.ini, or set SCRAI_CONFIG to this file's absolute path.
[scrai]
profile = groq
hotkey = ^G
# Escape, then g (often also Alt-G).
restore_hotkey = ^[g
context_chars = 12000
timeout_seconds = 30
instructions = Prefer clear, concise examples suitable for live teaching.

[groq]
base_url = https://api.groq.com/openai/v1
api_key_env = GROQ_API_KEY
model = openai/gpt-oss-120b
temperature = 0.2
max_tokens = 2048

[groq-small]
base_url = https://api.groq.com/openai/v1
api_key_env = GROQ_API_KEY
model = openai/gpt-oss-20b

# Other OpenAI-compatible chat-completion endpoints can be configured too.
# The client still requires the named environment variable; use a dummy value
# for a local server that does not require authentication.
[local]
base_url = http://localhost:11434/v1
api_key_env = LOCAL_MODEL_KEY
model = your-installed-model