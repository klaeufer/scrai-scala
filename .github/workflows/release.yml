name: Release standalone distribution

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build standalone archive
        env:
          SCRAI_VERSION: ${{ github.ref_name }}
        run: sbt -Dscrai.version="${SCRAI_VERSION#v}" standalonePackage
      - name: Test packaged executable
        env:
          SCRAI_SMOKE_EXECUTABLE: ${{ github.workspace }}/target/standalone-staging/bin/scrai
        run: python3 scripts/pty_smoke.py
      - name: Create checksum
        run: sha256sum target/scrai-standalone-scala3.9.zip > target/scrai-standalone-scala3.9.zip.sha256
      - name: Pin installer to this release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          sed \
            -e "s/__RELEASE_TAG__/${RELEASE_TAG}/g" \
            -e "s/__SCRAI_VERSION__/${VERSION}/g" \
            install.sh > target/install.sh
          chmod +x target/install.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          target/scrai-standalone-scala3.9.zip
          target/scrai-standalone-scala3.9.zip.sha256
          target/install.sh#install.sh
          --generate-notes
          --title "${{ github.ref_name }}"