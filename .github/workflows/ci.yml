name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and cross-build (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Runtime tests on every Scala line, plugin on both sbt lines
        run: >-
          sbt "runtime/test" "plugin/compile"
          "++3.3.7" "runtime/test"
          "++3.4.3" "runtime/test"
          "++3.5.2" "runtime/test"
          "++3.6.4" "runtime/test"
          "++3.7.4" "runtime/test"
          "++3.8.4" "runtime/test"
          "++3.9.0" "runtime/test"
          "++3.10.0" "runtime/test"
          "++3.8.4" "plugin/compile"

  smoke:
    name: PTY smoke test (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Run pseudo-terminal smoke test (project console)
        run: python3 scripts/pty_smoke.py
      - name: Upload terminal transcript
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pty-transcript-${{ matrix.os }}
          path: /tmp/scrai-pty-transcript.log
          if-no-files-found: ignore
          retention-days: 7

  fixture:
    name: Plugin fixture (${{ matrix.fixture }}, Scala ${{ matrix.scala }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: sbt1
            scala: "3.9.0"
          - fixture: sbt1
            scala: "3.3.7"
          - fixture: sbt1
            scala: "3.4.3"
          - fixture: sbt1
            scala: "3.5.2"
          - fixture: sbt1
            scala: "3.6.4"
          - fixture: sbt1
            scala: "3.7.4"
          - fixture: sbt1
            scala: "3.8.4"
          - fixture: sbt1
            scala: "3.9.0"
          - fixture: sbt1
            scala: "3.10.0"
          - fixture: sbt2
            scala: "3.9.0"
          - fixture: sbt2
            scala: "3.3.7"
          - fixture: sbt2
            scala: "3.4.3"
          - fixture: sbt2
            scala: "3.5.2"
          - fixture: sbt2
            scala: "3.6.4"
          - fixture: sbt2
            scala: "3.7.4"
          - fixture: sbt2
            scala: "3.8.4"
          - fixture: sbt2
            scala: "3.9.0"
          - fixture: sbt2
            scala: "3.10.0"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish every runtime and plugin variant locally
        run: sbt publishAllLocal
      - name: Run pseudo-terminal smoke test through the sbt plugin
        env:
          SCRAI_SMOKE_CWD: fixtures/${{ matrix.fixture }}
          SCRAI_TEST_SCALA_VERSION: ${{ matrix.scala }}
        run: SCRAI_SMOKE_TASK=console python3 scripts/pty_smoke.py
      - name: Upload terminal transcript
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pty-transcript-fixture-${{ matrix.fixture }}-${{ matrix.scala }}
          path: /tmp/scrai-pty-transcript.log
          if-no-files-found: ignore
          retention-days: 7

